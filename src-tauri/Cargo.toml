[package]
name = "pi-web-desktop"
version = "0.13.2"
description = "Tauri v2 shell that ships Pi Web as a desktop app"
authors = ["agegr"]
license = "MIT"
repository = "https://github.com/agegr/pi-web"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pi_web_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Workaround, not a real dependency: schemars 0.8.22 declares `indexmap 1.2`
# without the "std" feature, and indexmap 1.x only gives IndexMap's S
# parameter a default type under `has_std` - so tauri-build fails to compile
# with "expected 3 generic arguments". It has to sit in build-dependencies
# because that is where schemars is used: resolver v2 resolves features for
# build dependencies separately from normal ones.
# Remove once schemars ships a fixed release.
indexmap = { version = "1", features = ["std"] }

[dependencies]
# tray-icon for TrayIconBuilder; devtools so the "开发者工具" tray item
# also works in release builds (local-only app, no remote content).
tauri = { version = "2", features = ["tray-icon", "devtools"] }
# The Node sidecar is spawned with std::process::Command: Tauri resolves
# sidecar paths to verbatim `\\?\...` paths, which CreateProcessW rejects on
# non-ASCII install paths (os error 2).
# tauri-plugin-shell = "2"
tauri-plugin-process = "2"
# Two copies of the app share one agent dir (sessions, run records), which
# corrupts state; the second launch just focuses the running window instead.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# tauri-plugin-updater requires Rust >= 1.90.
tauri-plugin-updater = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
